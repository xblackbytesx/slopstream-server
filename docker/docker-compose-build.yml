# LOCAL BUILD of the production image, for smoke-testing it before you tag a
# release. Not a deployment: no reverse proxy, port published on the host.
# Run from the repo root (reads ./.env):  make image / make up / make down
# The deployable example (registry image, Traefik) is deploy/docker-compose.yml.
name: slopstream-server-local

services:
  slopstream-server:
    container_name: slopstream-server-local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: slopstream-server:local
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://slopstream:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@slopstream-server-local-db:5432/slopstream
      SLOPSTREAM_BIND: 0.0.0.0:8080
      SLOPSTREAM_SECRET_KEY: ${SLOPSTREAM_SECRET_KEY:?set SLOPSTREAM_SECRET_KEY in .env (make secret)}
      SLOPSTREAM_PUBLIC_URL: ${SLOPSTREAM_PUBLIC_URL:-}
      SLOPSTREAM_COOKIE_SECURE: ${SLOPSTREAM_COOKIE_SECURE:-false}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      slopstream-server-local-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  slopstream-server-local-db:
    container_name: slopstream-server-local-db
    image: docker.io/library/postgres:17-alpine
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: slopstream
      POSTGRES_USER: slopstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${SLOPSTREAM_DB_DIR:-../data/postgres}:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
