[workspace]
resolver = "3"
# core: the sync contract (wire types, merge rule, clock adjustment, channel
# references). Pure, no IO: the same rules the app is tested against.
# server: the web app, /api/v1 and the session checker.
members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"

[workspace.dependencies]
slopstream-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
